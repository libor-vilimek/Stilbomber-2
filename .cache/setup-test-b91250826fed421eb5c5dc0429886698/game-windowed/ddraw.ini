; Stilbomber windowed trial - cnc-ddraw v7.1.0.0
; https://github.com/FunkyFr3sh/cnc-ddraw
; The game still requests fullscreen internally; this wrapper presents a window.
[ddraw]
windowed=true
fullscreen=false
width=1024
height=768
posX=-32000
posY=-32000
border=true
resizable=true
maintas=true
renderer=auto
d3d9_filter=0
shader=Nearest neighbor
adjmouse=true
nonexclusive=true
savesettings=1
; Keep this trial windowed; do not accidentally toggle exclusive fullscreen.
keytogglefullscreen=0x00
keytogglefullscreen2=0x00
; Ctrl+Tab releases the mouse from the game window.
keyunlockcursor1=0x09
