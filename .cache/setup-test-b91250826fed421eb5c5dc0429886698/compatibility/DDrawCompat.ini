; Stilbomber 2 v1.03 (DelphiX / DirectDraw) on modern Windows.
; Keep the desktop display mode and scale the game's original picture.
FullscreenMode = borderless
; Keep Delphi forms in their original desktop/DPI context after a match.
; The 1024x768 game surface is scaled separately by DisplayResolution.
; 'initial' emulates physical pixels and breaks DPI-unaware form coordinates.
DesktopResolution = desktop
DesktopColorDepth = initial
DpiAwareness = app
DisplayResolution = desktop
DisplayRefreshRate = desktop
DisplayAspectRatio = app
DisplayFilter = point
RenderColorDepth = 32
LogLevel = info
