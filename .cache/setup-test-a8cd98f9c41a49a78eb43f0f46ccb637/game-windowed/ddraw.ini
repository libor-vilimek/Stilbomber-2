; Stilbomber borderless window - cnc-ddraw v7.1.0.0
; https://github.com/FunkyFr3sh/cnc-ddraw
; A desktop-sized window, not exclusive fullscreen or a display-mode switch.
[ddraw]
windowed=true
fullscreen=true
width=0
height=0
posX=-32000
posY=-32000
border=false
resizable=true
maintas=true
renderer=auto
d3d9_filter=0
shader=Nearest neighbor
adjmouse=true
nonexclusive=true
; DelphiX uses a child render control. Default fixchilds=2 disables scaling
; and paints the native 1024x768 image at the top left. Mode 3 makes the child
; transparent and keeps the scaled DirectDraw presentation underneath it.
fixchilds=3
savesettings=0
; Always use the current desktop size; do not restore a previous small window.
; Keep the wrapper windowed; do not accidentally toggle exclusive fullscreen.
keytogglefullscreen=0x00
keytogglefullscreen2=0x00
; Ctrl+Tab releases the mouse from the game window.
keyunlockcursor1=0x09
